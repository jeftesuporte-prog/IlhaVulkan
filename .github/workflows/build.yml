name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar o projeto
        run: unzip -oq IlhaVulkan_android.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar NDK e CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" "ndk;26.1.10909125" "platforms;android-34"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar
        working-directory: IlhaVulkan/android
        run: gradle assembleDebug --stacktrace

      - name: Conferir se a biblioteca nativa entrou no APK
        run: |
          APK=$(find IlhaVulkan/android -name "*.apk" | head -1)
          echo "$APK"
          unzip -l "$APK" | grep -E "libilha.so|shaders/" | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: IlhaVulkan-apk
          path: IlhaVulkan/android/app/build/outputs/apk/debug/*.apk
